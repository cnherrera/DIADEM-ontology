# ─────────────────────────────────────────────────────────────────────────────
#  DIADEM Project Description File  
#  One file per project (targeted or AAP).
#  Fill every field marked REQUIRED. Optional fields can be left blank or omitted.
#  Dates must follow ISO 8601: YYYY-MM-DD
#  Lists use the YAML dash-item syntax.
# ─────────────────────────────────────────────────────────────────────────────

project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "SOLEIL"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Platform for High Throughput Accelerated Materials Characterization at SOLEIL"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    SOLEIL offre une grande variété de techniques expérimentales et d’environnements
    échantillons pour la caractérisation multimodale des matériaux. Dans le projet PEPR
    DIADEM, cet arsenal expérimental sera porté à un nouveau degré d’efficacité
    scientifique pour une caractérisation à haut débit. Les différentes lignes de
    lumière où cette stratégie semble la plus adaptée sont : ANATOMIX, ANTARES,
    CASSIOPEE, CRISTAL, DIFFABS, GALAXIES, HERMES, MARS, NANOSCOPIUM, PUMA, PX2, PSICHE,
    ROCK, SEXTANTS, SWING and TEMPO.  Vers la caractérisation à haut débit Différentes
    actions sont prévues à SOLEIL pour répondre aux besoins du projet DIADEM vers une
    caractérisation à haut débit : i) Un nouveau flux de travail (workflow) combinera
    différentes expériences sur une même classe d’échantillons aidées par une analyse de
    données en ligne et une stratégie de modélisation guidée par l’IA. Le flux de
    travail générera un identificateur digital unique (DOI) qui sera sauvegardé avec les
    données. ii) Des changeurs d’échantillons rapides utilisant notamment des bras
    robotiques seront progressivement déployés sur les stations expérimentales avec la
    possibilité dans un plus long terme d’automatiser le transfert d’échantillons sous
    ultra vide. iii) Une nouvelle génération de détecteur pixelisé 2D sera développée
    dans le projet avec une grande surface sensible, un traitement de données intégré
    rapide, et une synchronisation optimisée avec les équipements des lignes de lumière.
    iv) La réduction automatique des données sera implémentée directement à la sortie
    des détecteurs utilisant des logiciels embarqués sur des cartes GPU et assistés par
    l’IA. Par ailleurs, des outils puissants de réduction et analyse des données seront
    mis à la disposition des utilisateurs ainsi des codes avancés de simulation
    numérique. v) Le mode rapide d’acquisition continue des données (FLYSCAN) sera
    généralisé sur les différentes stations expérimentales. vi) De nouveau modes d’accès
    aux lignes de lumières sont prévus comme les BAG (Block allocation Group) afin de
    fournir du temps de faisceau fréquent et garanti à un consortium d’utilisateurs, ou
    des hubs d’accès spécifiques.
  start_date: "2023-04-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2031-03-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/soleil/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "Diffraction at Synchrotron SOLEIL"
    - "Imaging at Synchrotron SOLEIL"
    - "Reflectivity at Synchrotron SOLEIL"
    - "Spectroscopy at Synchrotron SOLEIL"

