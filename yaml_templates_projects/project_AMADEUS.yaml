project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "AMADEUS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Automated and machine learning driven design and discovery of high entropy ceramics perovskite oxides for energy applications"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Dans le contexte socio-économique Européen actuel, la gestion de l'énergie est
    cruciale à tous les niveaux, de la production au stockage et à la distribution.
    Notre projet se concentre sur les enjeux de la production de sources d'énergie verte
    et durable. Nous visons le développement d'une nouvelle famille de matériaux
    d'électrode à base d'électrocatalyseurs non-nobles, actifs et stables, en utilisant
    une approche exploratoire globale qui intègre des outils de modélisation avancée, du
    criblage à haut débit, de l'intelligence artificielle (IA), de l’exploitation des
    données, ainsi que des techniques de synthèse et de mise en forme. Notre attention
    se porte sur l'étude de céramiques de type oxyde à haute entropie à structure
    pérovskites (HEPO), une famille de matériaux largement inexplorée mais offrant un
    potentiel prometteur dans l'électrocatalyse de l'eau. L'identification de matériaux
    à haute entropie stables et efficaces pour l'électrocatalyse dans cette famille
    exige une rupture dans les approches de conception numérique en raison de l'immense
    espace de compositions chimiques et de configurations qu'elle offre. AMADEUS propose
    une stratégie novatrice qui accélérera la découverte de nouvelles phases pérovskites
    catalytiquement actives par la mise en place d’outils en libre accès, de
    méthodologie de calcul automatisé et de criblage à haut débit. Nous construirons des
    diagrammes de phase et des domaines de stabilité en fonction de la composition des
    HEPO, et prédirons les compositions catalytiquement actives pour les réactions de
    dégagement du dihydrogène (H2) et du dioxygène (O2), en nous appuyant sur des
    méthodes de calcul ab initio fiables déjà validées. L'utilisation d'algorithmes
    d'apprentissage machine réduira considérablement l'effort de calcul ab initio,
    permettant ainsi une exploration de compositions chimiques en haute dimension. Nous
    développerons des architectures de réseaux neuronaux spécifiques basées sur les
    données ab initio pour prédire la stabilité des matériaux et leurs activités
    catalytiques. Toutes les données générées par AMADEUS seront regroupées dans la
    première base de données Française des matériaux à haute entropie, accessible à
    tous, et exploitées pour le développement d'outils d’IA. Nous utiliserons également
    des approches classiques de fouille de données pour mettre en évidence les
    corrélations latentes entre composition, structure et propriétés de ces matériaux.
    Ces efforts de modélisation nous permettront de définir les "règles de conception"
    des matériaux oxydes à haute entropie et de rationaliser les processus
    électrochimiques aux interfaces. Les systèmes les plus prometteurs identifiés seront
    synthétisés et mis en forme afin d'évaluer leurs performances en conditions réelles,
    d’élaborer des protocoles de synthèse et de mise en forme appropriés et d’apporter
    une compréhension fine des mécanismes
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
