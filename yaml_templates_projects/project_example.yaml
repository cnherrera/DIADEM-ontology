# ─────────────────────────────────────────────────────────────────────────────
#  DIADEM Project Description File  
#  One file per project (targeted or AAP).
#  Fill every field marked REQUIRED. Optional fields can be left blank or omitted.
#  Dates must follow ISO 8601: YYYY-MM-DD
#  Lists use the YAML dash-item syntax.
# ─────────────────────────────────────────────────────────────────────────────

project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "Acron"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Nice Title"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    The project description
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-10-01"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.towards_html.html"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

  # ── Lead & co-lead ───────────────────────────────────────────────────────
  lead:
    person:                # REQUIRED
      first_name: "Toto"
      last_name:  "MyToto"
      email:      null    # optional
      orcid:      null    # optional
    institution:           # REQUIRED
      acronym:   "Sorbonne Université"
      full_name: "Sorbonne Université"
      ror:       null  # optional

  colead:                  # optional block - leave fields null if there is no co-lead
    person:
      first_name: null
      last_name:  null
      email:      null    # optional
      orcid:      null    # optional
    institution:
      acronym:   null
      full_name: null
      ror:       null  # optional

  # ── Partner organisations ─────────────────────────────────────────────────
  organizations:           # REQUIRED - at least one
    - acronym:   "LCMCP"
      full_name: "Laboratoire de Chimie de la Matière Condensée de Paris (UMR 7574 Sorbonne Univ./CNRS)"
      ror:       null  # optional
    - acronym:   "IMN"
      full_name: "Institut des Matériaux de Nantes Jean Rouxel (UMR 6502 CNRS/Univ Nantes)"
      ror:       null  # optional
    - acronym:   "LINK"
      full_name: "Laboratory for Innovative Key Materials and Structures (IRL 3629 CNRS/NIMS/STGOBAIN)"
      ror:       null  # optional
    - acronym:   "Synchrotron SOLEIL"
      full_name: "Synchrotron SOLEIL"
      ror:       null  # optional

# ── DIADEM Facets & Taxonomy ─────────────────────────────────────────────
# Please select/add terms from the DIADEM controlled vocabulary where possible.
keywords:

  competences:
  - "New materials"
  - "Liquid-phase synthesis"
  - "Molten salts"
  - "Intermetallics and compounds"
  - "X-ray diffraction"
  - "in situ"
  - "Crystal structure prediction"
  - "Supervised machine learning"
  - "Graph neural networks"
  - "Electrocatalysis"
  - "Nouveaux matériaux"
  - "synthèse en phase liquide"
  - "sels fondus"
  - "intermétalliques et composés"
  - "diffraction des rayons X"
  - "in situ"
  - "prédiction de la structure cristalline"
  - "apprentissage automatique supervisé"
  - "réseaux neuronaux graphiques"
  - "électrocatalyse"
  - "synthesis"
  - "xrd"
  - "phase"
  - "syntheses"
  - "structures"
  - "structure"
  - "crystal"
  - "prediction"
  - "electrocatalysis"
  - "chemical"

  scientific_domain: []  # fill by hand

  methodology: []  # fill by hand

  # Depending on the project's methodology (you can inspire from the list_keyword.yaml file):

  #if characterization:
  characterization_tools: []  # fill by hand (if characterization)

  #if simulation:
  simulation_tools: []  # fill by hand (if simulation)

  # if synthesis:
  synthesis_tools: []  # fill by hand (if synthesis)

# ── Products at the level of the Project ──────────────────────────────────
# List here any products or deliverables of the project that are not 
# detailed at the level of each work package
project_products:                     # products produced by the project: datasets, reports, algorithms, etc.
- name: null
  description: null
  url: null                  # optional

# ── If any collaboration is ongoing with another DIADEM project ──────────────────────────────────
# Add here any resource used that was produced by a DIADEM project
uses_project_output:
- name: null
  project: null

# ── Work packages ─────────────────────────────────────────────────────────
# Example structure below. Duplicate this block once per work package,
# fill it in, and remove any lines that don't apply.
work_packages:               # optional
- number: null               # REQUIRED - integer
  acronym: null               # optional short label, e.g. "WP1"
  title: null                 # REQUIRED
  description: null           # REQUIRED
  lead_institution: null      # REQUIRED - must match an acronym in organizations
  lead_person:                # REQUIRED
      first_name: null
      last_name:  null
      email:      null    # optional
      orcid:      null    # optional
  deliverables:                # optional
  - title: null
    description: null
    due_date: null             # optional
    type: null                 # optional - e.g. report / software / dataset / other
  tasks:                        # optional
  - id: null
    title: null
    description: null
  tools:                        # tools (software, algorithms, etc) used in this work package
  - name: null
    url: null                  # optional
  products:                     # all products produced by the WP: datasets, reports, algorithms, etc.
  - name: null
    description: null
    url: null                  # optional
  competences:                  # list competences used/developed in this work package
  - null
  contributors:                 # people working on this WP
  - first_name: null
    last_name: null
    email: null                # optional
    orcid: null                # optional
    competences:                # this contributor's competences within the WP
    - domain: null
      level: null              # optional
