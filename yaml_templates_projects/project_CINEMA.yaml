project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "CINEMA"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Smart growth of novel thin films of enhanced functional oxides"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet CINEMA est un projet de recherche académique ambitieux ayant pour objectif
    la croissance intelligente par épitaxie par jets moléculaires (MBE) de nouvelles
    couches minces d’oxydes fonctionnels améliorées. Concernant le premier objectif
    principal de croissance intelligente, deux approches seront étudiées en utilisant
    des solutions solides modèles d’oxydes thermoélectriques de structure pérovskite
    basées sur SrTiO3, déjà bien maîtrisées à l’INL. La première approche est basée sur
    des mesures operando pendant la croissance et de l’apprentissage profond par des
    algorithmes de l’intelligence artificielle (IA). Dans un premier temps, il inclura
    le couplage de nombreuses mesures in-situ et operando des propriétés structurales et
    physiques pendant la croissance en temps réel (INL). Dans un deuxième temps, il
    inclura le traitement de ces données par des algorithmes utilisant des réseaux de
    neuronaux convolutifs (IRCER, INL, plateforme DIADEM-DM). Dans un troisième temps,
    des boucles de rétroaction seront mises en place pour le contrôle de la croissance
    par les propriétés visées, mesurées et analysées en temps réel. La seconde approche
    consiste à créer un jumeau numérique de la croissance par des simulations (P’). Ces
    simulations seront effectuées par Monte Carlo cinétique (k-MC) et par des calculs
    DFT optimisés par des algorithmes de l’IA (Collab. Univ. Montreal & LAAS). Les
    résultats théoriques seront confrontés aux résultats expérimentaux de complexité
    croissante (oxydes binaires, ternaires et enfin quaternaires). Un deuxième objectif
    conjoint concerne la prédiction par IA et l’élaboration par MBE de nouvelles
    solutions solides d’oxydes thermoélectriques de type p performants (PF > 10 μW cm-1
    K-2), stables et durables (contentant des éléments non/peu toxiques et abondants).
    Dans un premier temps, ces prédictions nécessiteront d’alimenter une base de données
    et de l’analyser (plateforme DIADEM-DM). Dans un deuxième temps, la stabilité
    structurale de ces nouveaux oxydes sera évaluée par calculs DFT (P’). Dans un
    troisième temps, les propriétés thermoélectriques des nouveaux oxydes les plus
    prometteurs seront estimées par calculs ab-initio (ILM). Enfin, les solutions
    solides les plus prometteuses seront élaborées en couches minces par MBE, assistée
    par IA, et l’ensemble de leurs propriétés thermoélectriques seront mesurées (INL,
    ILM). En plus de la plateforme DIADEM-DM, ce projet réunit quatre partenaires
    académiques reconnus et complémentaires ayant toutes les compétences et outils à
    disposition pour atteindre les objectifs visés. Ce projet permettrait d’accélérer la
    découverte et la maîtrise de nouveaux matériaux aux propriétés améliorées, dans
    différents champs d’applications, dans la recherche académique et l’industrie.
  start_date: "2026-03-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-02-28"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/cinema/"   # optional
