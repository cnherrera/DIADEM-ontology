project:
  type: Targeted
  acronym: DIAMOND
  title:
    en: Data management and Infrastructures for Artificial intelligence, Modelling, Optimization and Numerical Design
    fr: Bases de Données, outils d’Intelligence Artificielle, de Modélisation et d’OptimisatioN pour le Design Numérique de
      matériaux
  description:
    fr: L’objectif principal de ce projet ciblé est de mettre en place une infrastructure numérique pour accélérer le développement
      des matériaux. Elle est basée d’une part sur une plateforme dédiée aux codes de simulation aux différentes échelles
      et aux workflows pour l’automatisation de séries de calculs, dont les calculs à haut débit et le traitement des résultats
      par intelligence artificielle (IA) et d’autre part sur une infrastructure de bases de données venant à la fois des expériences
      et des simulations. Pour chacune de ces infrastructures, des cas d’usage issus des projets ciblés en coursont été identifiés
      pour servir d’exemple et s’assurer de l’adéquation avec les besoins des utilisateurs, ils concernent les projets MOF-learning,
      ESRF et FastNano. Un démonstrateur utilisant ces deux infrastructures sera également développé, il sera consacré au
      développement par apprentissage machine de potentiels interatomiques pour les simulations à l’échelle atomique. Les
      cahiers des charges de ces infrastructures et ce démonstrateur seront établis en s’appuyant sur des groupes de travail
      avec des représentants des principaux laboratoires concernés. La plateforme codes et workflows sera développée et déployée
      au meso-centre de calcul GRICAD et l’infrastructure de bases de données sera déployée au TGCC.
    en: The main objective of this targeted project is to establish a digital infrastructure to accelerate materials development.
      It is based, on the one hand, on a platform dedicated to multi-scale simulation codes and workflows for automating series
      of calculations—including high-throughput calculations and the processing of results using artificial intelligence (AI)—and,
      on the other hand, on a database infrastructure fed by both experiments and simulations. For each of these infrastructures,
      use cases from ongoing targeted projects have been identified to serve as examples and ensure alignment with user needs;
      these relate to the MOF-learning, ESRF, and FastNano projects. A demonstrator utilizing both infrastructures will also
      be developed, focusing on the machine learning development of interatomic potentials for atomic-scale simulations. The
      specifications for these infrastructures and this demonstrator will be established based on working groups with representatives
      from the main relevant laboratories. The codes and workflows platform will be developed and deployed at the GRICAD meso-centre
      for high-performance computing, and the database infrastructure will be deployed at the TGCC.
  start_date: '2023-04-01'
  end_date: '2029-03-31'
