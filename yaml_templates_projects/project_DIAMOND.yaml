source_notes:
- 'People, organizations and ckey terms are represented as references to the shared ppl:, org: and ckey: TTL files; they are
  not defined locally here.'
- The YAML template says dates must be ISO 8601, but the source TTL stores personnel join/left dates only as month-year strings
  (and includes 'Mars'). These values are retained verbatim rather than inventing a day.
- scientific_domain, methodology and characterization/synthesis/simulation facet lists are not defined in the supplied project
  TTL and therefore remain empty.
- The source TTL uses local project resources/classes for some relationships that would normally be shared refs (for example
  proj:DiamondDBInfrastructure on MongoDB and local scientific-responsable nodes). The generator keeps the YAML representation
  explicit so these can be reviewed rather than hidden.
- 'For WP scientific responsables, the source TTL points to local :MARCO_SAITTA/:THIERRY_DEUTSCH nodes even though the people
  are defined under ppl:. The generator deliberately normalizes these two links to the shared ppl: namespace, matching the
  stated project-wide rule.'