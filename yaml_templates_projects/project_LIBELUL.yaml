project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "LIBELUL"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "LIBS for ELemental high throughpUt anaLysis"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le développement accéléré des matériaux par l’usage de l’intelligence artificielle
    tel que proposé dans le projet PEPR DIADEME requiert le développement d’outils
    d’analyse haut débit afin d’alimenter les bases de données utilisées. Dans ce cadre,
    l’analyse élémentaire peut être effectuée à l’aide de la technologie LIBS (Laser
    Induced Breakdown Sprectroscopy) dont le principe consiste à analyser le spectre
    d’émission de fluorescence du plasma induit par l’ablation du matériau à analyser
    par une impulsion laser. Cette technique permet ainsi de détecter les différents
    constituants de matériaux très divers (métaux, isolants, polymères...) avec un très
    bon niveau de sensibilité pouvant descendre à quelques ppm pour certains éléments et
    est tout à fait adaptée à la stratégie du projet DIADEME. Le projet LIBELUL vise à
    développer deux expériences « plateformes » exploitant la technologie LIBS. La
    première plateforme consistera à la mise en place d’une cartographie élémentaire sur
    de très grandes surfaces avec un pas de mesure de 30 mm, nécessitant de viser la
    très haute cadence laser (jusqu’au kHz). L’imagerie sera couplée sur une unique
    expérience à de la spectroscopie RAMAN et de Luminescence. En effet, la
    spectroscopie RAMAN informe sur les aspects structuraux alors que la spectroscopie
    de Luminescence peut également informer sur les propriétés optiques d’un grand
    nombre d’impuretés dans leur environnement ainsi que certains défauts. L’usage de
    l’intelligence artificielle sera également exploité pour la détection automatique
    des éléments majeurs et l’amélioration du rapport signal à bruit afin d’accélérer
    également le traitement des données brutes. Si la première plateforme prévoit de
    recevoir les matériaux à analyser, la seconde plateforme LIBS prévoit au contraire
    d’aller sur le lieu de synthèse haut débit de matériaux. Il s’agit donc de
    développer une plateforme LIBS mobile et adaptable pouvant être opérée sur site.
    Cette seconde plateforme présentera les meilleures performances combinant
    sensibilité et reproductibilité et aura vocation à être facilement opérable. Ces
    deux plateformes viendront enrichir les outils d’analyse élémentaire haut débit du
    projet DIADEME.
  start_date: "01/06/2022"   # REQUIRED  YYYY-MM-DD
  end_date:   "2026-02-28"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/libelul/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "Mobile LIBS platform"
    - "Multi-characterization by LIBS/Raman/photoluminescence imaging"

