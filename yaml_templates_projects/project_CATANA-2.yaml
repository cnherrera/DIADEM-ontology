project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "CATANA-2"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Cooperative modeling – experimental learning for the identification of low temperature catalysts for the synthesis and decomposition of NH3"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    L’hydrogène (H2) est aujourd’hui présenté comme un vecteur énergétique réaliste,
    mais il souffre du manque de solutions de stockage à long terme. L'ammoniac (NH3)
    présente des avantages intéressants en termes de densité énergétique et est
    considéré comme une alternative, mais sa production actuelle par le procédé
    thermocatalytique Haber-Bosch (H-B), énergivore, centralisé et contribuant de
    manière significative aux émissions de CO2, handicape son développement. Le
    déploiement d'une voie de synthèse décarbonée, compatible avec les énergies
    renouvelables (EnR), nécessite l'utilisation d'H2 issu de l'électrolyse de l'eau, et
    ne peut s'envisager que sur des unités décentralisées répondant à la problématique
    de l'intermittence des EnR. Ce changement de paradigme induit de nouvelles
    contraintes sur les conditions opératoires Température/Pression (T/P) de la
    synthèse, et par conséquent sur le développement des catalyseurs hétérogènes
    associés. Toujours dans l’optique de l’utilisation de NH3 comme média de stockage de
    H2, la réaction de craquage doit également être optimisée d’un point de vue
    catalytique, le procédé étant aujourd’hui inexistant, or la littérature montre
    clairement que les catalyseurs actifs pour la réaction de craquage ne sont pas
    nécessairement les meilleurs pour la synthèse. La constatation inverse est également
    valable.
  start_date: "2026-01-05"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-01-04"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/catana-2/"   # optional
