  - "(9) Water adsorption (thermodynamics and kinetics); (10) Humidity Controller Prototype (Building physics)\n\n(1) Structures métallo-organiques (MOF) ; (2) Adsorption/désorption de l'eau ; (3) Contrôle autonome de l'humidité ; (4) Construction et analyse d'une base de données structurelles ; (5) Criblage à haut débit par simulations moléculaires (Monte Carlo et dynamique moléculaire) ; (6) Apprentissage automatique ; (7) Conception de nouveaux matériaux assistée par l'intelligence artificielle ; (8) Synthèse et caractérisation à haut débit"
  - "(9) Adsorption de l'eau (thermodynamique et cinétique) ; (10) Prototype de contrôleur d'humidité (physique du bâtiment)"
