project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "AI-MAHC"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Artificial Intelligence-Driven MOF Materials Discovery for Autonomous Humidity Control"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le marché mondial du contrôle de l’humidité de l’air devrait atteindre 15,1
    milliards de dollars d'ici 2032, porté par des préoccupations croissantes quant à la
    qualité de l'air intérieur, des niveaux d'humidité en hausse et la fréquence accrue
    des événements météorologiques extrêmes. Les systèmes actuels de contrôle de
    l’humidité tels que les déshumidificateurs, les humidificateurs et les solutions
    basées sur le chauffage, la climatisation et la ventilation (HVAC), présentent des
    inconvénients notables, notamment une consommation énergétique élevée, des exigences
    de maintenance, l'utilisation de réfrigérants à fort potentiel de réchauffement
    global et une imprécision dans la régulation des niveaux d'humidité optimaux. Ces
    limitations soulignent la nécessité de trouver des solutions de contrôle de
    l’humidité plus performantes pour répondre durablement à la demande croissante. Les
    systèmes de contrôle autonome de l'humidité (AHC), intégrant des matériaux poreux
    avancés, devraient révolutionner les technologies HVAC, notamment dans le cadre des
    objectifs du Green Deal (économie neutre en carbone d'ici 2050). Les systèmes AHC
    visent à moduler de manière autonome les niveaux d'humidité de l'air intérieur grâce
    à un matériau poreux capable d’adsorber l'eau dès que le taux d'humidité relative
    (HR) atteint 60 % et de désorber rapidement l'eau lorsque HR atteint 40 %, sans
    intervention extérieure, pour préserver la santé et le confort des occupants.
    Aujourd’hui, aucun des adsorbants poreux conventionnels, tels que les gels de silice
    et les zéolithes, n’est optimal pour l’application visée car leur adsorption d’eau
    se produit en dehors de la plage de HR souhaitée et ils présentent des capacités
    d’adsorption d’eau insuffisantes et des cinétiques d’adsorption lentes. Il est donc
    indispensable de concevoir de nouveaux adsorbants poreux présentant des
    caractéristiques idéales d’adsorption de l'eau. Si certains matériaux hybrides
    poreux de type MOFs présentent des performances prometteuses, cependant nous sommes
    encore loin de pleinement exploiter le potentiel immense de cette famille de
    matériaux car leur sélection repose encore largement sur la sérendipité. Notre
    objectif est d’échafauder une stratégie sans précédent basée sur le criblage
    numérique à haut débit, des techniques d'apprentissage automatique (ML), des outils
    d’intelligence artificielle (IA), de la synthèse/caractérisation robotique à haut
    débit et des techniques d’adsorption avancées pour découvrir de nouveaux MOFs
    robustes, durables et non toxiques ayant des performances exceptionnelles en matière
    de contrôle de l'humidité.
  start_date: "2025-11-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2029-10-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/ai-mahc/"   # optional
