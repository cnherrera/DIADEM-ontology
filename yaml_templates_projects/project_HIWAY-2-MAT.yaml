project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "HIWAY-2-MAT"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "High-throughput combinatorial and autonomous pathways in Solid State Chemistry"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Ces dernières années, des approches originales ont été développées pour accélérer la
    découverte de nouveaux matériaux : La voie combinatoire et la voie de recherche
    autonome. La voie combinatoire permet la production de librairie de matériaux
    contenant formellement plusieurs centaines voire milliers de compositions. La
    recherche autonome suppose l’emploi de robots de découverte de matériaux comprenant
    des modules de synthèse, de caractérisation des propriétés structurelles et
    fonctionnelles automatisés, et faisant appel à des modèles d'IA pour le choix des
    zones à explorer. Une telle combinaison permet d'explorer des espaces
    multidimensionnels complexes pour optimiser la composition des matériaux sans aucune
    intervention humaine. Dans ce domaine de recherche, l'Europe est loin derrière les
    États-Unis et la Chine. Notre ambition dans le cadre de ce projet ciblé est à la
    fois d'utiliser des approches combinatoires à haut débit et de développer des
    configurations autonomes pour explorer les espaces de composition des matériaux pour
    les applications à faible consommation d'énergie. Concrètement, nous appliquerons
    les approches proposées pour accélérer la découverte de matériaux d'oxyde pour les
    fenêtres intelligentes, les capteurs intelligents, l'éclairage à faible consommation
    et les systèmes électroniques. La voie combinatoire parallélisée sera mise en œuvre
    et bouclée avec des modèles d'IA. Des interactions avec d'autres projets ciblés
    permettront d'étendre cette stratégie autour des oxydes à d'autres catégories de
    matériaux. Enfin, en plus d'automatiser la découverte de nouveaux matériaux, cette
    stratégie devrait aider les chercheurs à acquérir une connaissance et une
    compréhension statistiquement fondées de la relation composition-(micro)structure-
    propriété.
  start_date: "2022-07-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2026-12-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/hiway-2-mat/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "Automated XRD synthesis and characterization of powder libraries"
    - "Autonomous robotic synthesis of powders and thin films"
    - "Combinatorial PVD"

