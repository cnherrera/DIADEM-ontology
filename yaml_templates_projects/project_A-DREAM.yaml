project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "A-DREAM"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Accelerated Development of corrosion REsistAnt Materials"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    L'objectif du projet A-DREAM est de développer une approche générique pour accélérer
    la découverte de matériaux et revêtements résistants à la corrosion dans des
    environnements sévères. Elle est appliquée dans cette étude au sel fondu LiCl-KCl à
    450°C. Une base de données corrosion a d'abord été élaborée à partir de données de
    la littérature et un modèle de résistance des alliages métalliques à la corrosion
    par les sels fondus a été construit par une approche novatrice de fouille de
    données, associant un algorithme de classement par comparaison de paires à un outil
    de régression par apprentissage machine. Puis grâce à l'élaboration de matériaux
    massifs et matériaux revêtus par des voies de synthèse combinatoire (PVD,
    fabrication additive) ou par voies conventionnelles (Cold Spray, four de fusion)
    ainsi que l'apport d'alliages complexes concentrés et à haute entropie issus du
    projet ciblé DIAMS, des essais haut débit de corrosion ont été réalisés. Plus de 70
    nuances différentes ont été testées, constituées de 19 éléments différents. Deux
    types d’essais haut débit ont été réalisés : (i) des essais d’immersion en mini-
    béchers pour les matériaux massifs, (ii) des essais sur des plaquettes avec des
    pastilles de sels fondus pour les films minces et revêtements. L'intégration de ces
    données a permis de donner lieu à de nouveaux classements de matériaux via
    l'algorithme SpringRank qui vont permettre l'établissement de deux autres modèles de
    corrosion pour relier le score à la composition élémentaire. Au total, trois modèles
    de corrosion seront utilisés et comparés pour la phase d’optimisation multicritères
    permettant de proposer des compositions de matériaux optimisées vis-à-vis de la
    corrosion et vis-à-vis de l’impact environnemental. Des avancées importantes ont
    également été réalisées pour l'acquisition de données in situ, notamment par
    spectroscopie Raman. Pour cela une cellule dédiée a été développée permattant
    l'acquisition de spectres Raman en chlorures fondus à 450°C pour le suivi de la
    corrosion. Des mesures électrochimiques en goutte de sels sont en cours
    développement, couplées à la spectroscopie Raman permettant l'acquisition de données
    à la fois sur le matériau corrodé et au sein du sel.
  start_date: "2022-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2027-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/a-dream/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
