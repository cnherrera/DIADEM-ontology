project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "MicroElec"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "High throughput heterostructures elaboration and characterization for microelectronic applications"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    L’innovation dans les matériaux fonctionnels est clé pour accroître la compétitivité
    d’une industrie de la microélectronique soutenable et plus efficace en Europe. Ces
    dernières années, une nouvelle approche visant la découverte accélérée de nouveaux
    matériaux a été développée avec l’élaboration et la caractérisation haut débit de
    bibliothèques de matériaux. Nous proposons d’étendre cette approche dite
    combinatoire haut débit aux dispositifs microélectroniques multicouches dont les
    propriétés fonctionnelles dépendent à la fois de la nature de chacune de leurs
    couches constitutives et des interactions entre ces couches. Améliorer les
    performances de ces dispositifs revient de fait à optimiser globalement l’empilement
    de couches. Comprendre et optimiser une telle complexité grâce à des procédés de
    synthèse, de caractérisation et d’analyse haut débit assistés par intelligence
    artificielle (IA) de bibliothèques d’hétérostructures présentant une variation
    systématique et simultanée de paramètres clés permettrait d’accélérer l’élaboration
    de dispositifs efficaces et d’approvisionner massivement des bases de données
    matériaux. Pour valider cette approche haut débit assistée par IA dans le cadre
    d’applications en microélectronique, des plateformes de synthèse et caractérisation
    combinatoires existantes seront renforcées et étendues puis utilisées pour définir
    le composé / l’hétérostructure sans plomb les plus adaptés pour leur intégration
    dans des actuateurs piézoélectriques micrométriques ainsi que dans des mémoires non-
    volatiles ferroélectriques nanométriques.
  start_date: "2023-05-15"   # REQUIRED  YYYY-MM-DD
  end_date:   "2026-11-14"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/microelec/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "Combinatorial growth of heterostructures by PLD/PVD"
    - "Operando characterization of electronic structure under electrical stress"
    - "Structural and electrical characterization of 2D gradient layers"

