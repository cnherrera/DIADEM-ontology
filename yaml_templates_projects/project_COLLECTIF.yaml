project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "COLLECTIF"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Development of current-collecting materials for electrolysis cells using high-throughput and AI methods Discovery of new catalyst Materials for production of Bio-fuel"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet proposé, COLLECTIF, vise à étudier la couche de collecte de courant dans
    les cellules d'électrolyse à oxyde solide (SOEC) en utilisant des approches de
    recherche combinatoires et autonomes à haut débit. Cette étude est cruciale pour
    améliorer les performances et la durabilité des SOEC, qui sont des composants clés
    dans les technologies de production d'hydrogène vert et de conversion du CO2. En
    intégrant des méthodes avancées de découverte de matériaux avec un criblage à haut
    débit et l'intelligence artificielle, de nouveaux matériaux et structures pour la
    couche de collecte de courant seront identifiés et optimisés. Cette approche
    innovante permettra d'accélérer considérablement le développement de SOEC efficaces
    et durables, contribuant ainsi à des solutions énergétiques durables. Le projet
    réunit des experts de premier plan et des installations de pointe du CNRS du CEA et
    de CentraleSupélec, assurant un effort de recherche multidisciplinaire et complet.
    Les résultats attendus incluent des publications scientifiques de haut niveau, des
    découvertes de nouveaux matériaux, le développement d’outils scientifiques haut-
    débit, et des voies potentielles de commercialisation pour des technologies SOEC
    améliorées. Dans ce contexte, le CEA-Tech aura pour mission d’élaborer des matériaux
    conducteurs électronique sous forme de couches minces et de réaliser un « criblage »
    des compositions. Les matériaux obtenus seront ensuite caractérisés par plusieurs
    méthodes chez les différents partenaires et en particulier au Synchrotron SOLEIL
    pour des expériences in situ et combinées de diffraction des rayons X et de
    spectroscopie de fluorescence X. La mise en place de nouveaux outils de collecte
    automatisée des données et leur analyse systématique sera réalisée au laboratoire
    SPMS à l’Ecole CentraleSupélec. Les meilleurs matériaux de collectage seront ensuite
    testés dans ces cellules SOFC et SOEC à l’ICMCB pour des caractérisations
    électrochimiques en conditions réelles.
  start_date: "2025-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
