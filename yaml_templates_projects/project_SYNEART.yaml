project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "SYNEART"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Artificial synapses and neurons based on ferroelectric relaxors: towards lower-power AI"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Ce projet cherche à révéler le potentiel des matériaux ferroélectriques relaxeurs
    dont les caractéristiques sont très prometteuses pour la conception de dispositifs
    nanoélectroniques pour l’informatique neuromorphique. Contrairement aux matériaux
    ferroélectriques classiques, le domaine des couches minces à base de relaxeurs n'en
    est qu'à ses débuts. À travers une approche de synthèse combinatoire, des outils de
    caractérisations structurales, chimiques et électriques haut-débit couplés à des
    analyses et prédictions basées sur l’intelligence artificielle, nous souhaitons
    identifier les compositions/épaisseurs/électrodes les plus pertinentes et les
    utiliser comme briques élémentaires pour concevoir des neurones et des synapses
    artificiels. Au-delà des matériaux relaxeurs neuromorphiques d’intérêt dans le
    présent projet, les protocoles de synthèse, caractérisation et prédictions haut
    débit, et les outils de traitement et d’analyse des données par intelligence
    artificielle, seront développés ou consolidés pour être mis à disposition de la
    communauté afin de faciliter et d’accélérer la découverte de nouveaux matériaux dans
    d’autres domaines et leur mise sur le marché.
  start_date: "2026-03-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2029-08-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/syneart/"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

