project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "REBORN"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Optimization and modeling of 2D h-BN epitaxy and its high-quality layered heterostructures using artificial intelligence."   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    H-BN est un nouveau matériau 2D qui commence à jouer un rôle important dans les
    dispositifs optoélectroniques et électroniques de nouvelle génération. Étant produit
    dans des réacteurs MOVPE industriels qui permettent l’épitaxie des hétérostructures
    à base de GaN, h-BN peut être commercialisé en masse. Compte tenu de la complexité
    de l'environnement d'épitaxie, l'amélioration de la qualité épitaxiale de h-BN n’est
    pas une tache aisée. Ce projet vise à améliorer de manière significative la qualité
    des matériaux optoélectroniques à base de h-BN par le biais d'une caractérisation
    avancée et d'une optimisation des paramètres de croissance épitaxiale guidée par
    l'IA. Les résultats attendus devraient fournir une connaissance détaillée de
    l'épitaxie van der Waals (vdW) du h-BN et clarifier la voie pour l'adoption du h-BN
    par l'industrie en France.  Applications du h-BN : Les fonctionnalités de h-BN sont
    diverses. Utilisé comme couche sacrificielle, il permet le décollage aisé et le
    transfert de dispositifs optoélectroniques III-N (LED, capteurs, transistors, etc.)
    sur des supports arbitraires, ce qui permet une utilisation plus flexible et
    améliore les performances thermiques. Deuxièmement, utilisé comme couche active,
    h-BN peut servir de matériau dopé p et de couche de blocage des électrons pour les
    LED UV. Troisièmement, il peut permettre l'intégration hétérogène de différents
    matériaux semi-conducteurs, conduisant à la réalisation d'écrans LED multicolores de
    résolution record. Enfin, il peut être utilisé dans les supercondensateurs et des
    unités de séparation des ions hydrogène. Obstacles existants et approche pour les
    surmonter : (1) Lorsque h-BN est utilisé comme couche de séparation, les structures
    épitaxiée au-dessus présentent une densité de défauts plus élevée que celle obtenue
    avec les procédés actuels de GaN sur saphir. Vu le nombre important de paramètres de
    croissance (température, pression, rapport V/III, vitesse de croissance), de
    nouvelles techniques sont nécessaires pour trouver les conditions de croissance
    optimales afin d'améliorer la couche initiale de hBN, les couches suivantes et les
    matériaux 3D à base de GaN. (2) Lorsque le h-BN est utilisé comme couche active, des
    améliorations de la densité des défauts, du dopage et des interfaces avec les
    matériaux 3D AlGaN sont nécessaires pour que les niveaux d'émission UV deviennent
    compétitifs. (3) Les simulations de la dynamique de croissance MOVPE sont
    notoirement peu fiables et l'espace des paramètres est trop vaste pour être exploré
    uniquement par simulation. Ces obstacles soulignent la nécessité d'une
    caractérisation plus poussée des échantillons à différents stades de croissance et
    l'utilisation de procédures d'optimisation guidées par l'IA pour identifier les
    paramètres de croissance permettant la production de h-BN de haute qualité.
  start_date: "2025-11-24"   # REQUIRED  YYYY-MM-DD
