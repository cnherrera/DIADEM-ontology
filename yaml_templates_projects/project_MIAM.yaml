project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "MIAM"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Accelerating the discovery of innovative permanent magnets with reduced content of critical rare earths"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet MIAM répond au besoin d’accélérer la découverte et le développement de
    nouveaux aimants permanents de haute performance et à faible teneur en terres rares
    en s’appuyant sur les méthodes de fabrication et caractérisation à haut débit et de
    l’intelligence artificielle. Les aimants à base de terres rares sont nécessaires
    pour le fonctionnement des machines électriques dont ils améliorent les rendements
    et la compacité. Ils sont particulièrement performants pour des moteurs de traction
    et les génératrices installées dans les éoliennes off-shore. Les aimants occupent
    donc une position clef dans la transition vers des transports et des énergies
    décarbonés. Dans un contexte de forte croissance de la demande de ces composants, la
    minimisation des terres rares dans les aimants répond à un double enjeu de
    sécurisation des approvisionnements et de réduction des impacts environnementaux.
    Cette rupture pourrait être atteinte par la substitution des aimants actuels, de
    type R2Fe14B, par une nouvelle famille d’aimants de type RT12-xMx, cristallisant
    dans la structure ThMn12 et possédant une aimantation équivalente (R = terres rares;
    T = métaux de transition, M = éléments de stabilisation). Le gain sur la teneur en
    terres rares serait alors de 30 à 50 %. De nombreuses combinaisons d’éléments de R
    (Nd, Sm, Ce), de T (Fe, Co,) et M (Mo, Ti, V, etc.) sont possibles dans cette
    famille de matériaux. La diversité des compositions et des paramètres d’élaboration
    à investiguer dans une échelle de temps courte n’est pas compatible avec une
    approche conventionnelle mais nécessite de mettre en oeuvre des méthodes de
    fabrication et caractérisation à haut débit et de prédictives des propriétés finales
    des aimants. Le projet MIAM vise donc à proposer une méthodologie pertinente pour le
    design de ces matériaux magnétiques en couvrant toutes les échelles de la
    microstructure qui sont impliquées dans l’obtention des performances finales de
    l’aimant. Il permet de couvrir une thématique qui n’est pas encore abordée dans le
    PEPR DIADEM tout en étant connecté à plusieurs plateformes et projets ciblés du
    programme. Le consortium réunit de façon complémentaire des partenaires « leaders »
    dans leur domaine : le CEA-LITEN qui possède une ligne pilote unique en France pour
    l’étude des procédés d’élaboration
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/miam/"   # optional
