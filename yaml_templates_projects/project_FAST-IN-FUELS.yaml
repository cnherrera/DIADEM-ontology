project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "FAST-IN-FUELS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Fresh Acceleration Strategies of characterization, manufacturing and simulation Techniques for Innovative Nuclear Fuels"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    La production d’énergie bas carbone est une priorité pour limiter l’impact du
    dérèglement climatique et notre société doit s’appuyer sur un mix énergétique
    compétitif associant énergies renouvelables et nucléaire. L’accélération de la
    découverte de matériaux innovants et durables pour les combustibles nucléaires est
    au coeur de cette stratégie. Les enjeux sont de découvrir des matériaux offrant i)
    une flexibilité accrue des réacteurs, ii) une performance/sureté accrue iii)
    l’optimisation de l’utilisation des ressources et la valorisation des matières par
    le recyclage, iv) la réponse aux cahiers des charges des réacteurs nucléaires
    avancés. Le projet FAST-IN-FUELS a l’ambition de contribuer à répondre à ces enjeux
    et s’inscrit pleinement dans les objectifs du PEPR DIADEM pour une découverte
    accélérée de matériaux combustibles nucléaires innovants. Son caractère novateur
    réside dans la mise en oeuvre, aux différentes étapes de la R&D combustible
    (conception, fabrication, caractérisation, qualification), de démonstrations
    d’approches d’accélération qui ont très peu, voire jamais été déployées sur ces
    matériaux d’importance majeure pour le nucléaire et devraient à terme permettre
    d’augmenter notre capacité d’innovation. FAST-IN-FUELS embarquera un consortium
    interdisciplinaire (CEA/DES, CEA/DRF, CNRS-IRCER, ECM-IF, CS-LGPM) autour de
    l’innovation sur les matériaux combustibles et de méthodes d’accélération. Le projet
    est articulé autour de 5 briques techniques interconnectées et complétées d’une 6ème
    brique Management –Transversalité - Dissémination assurant la bonne interaction
    entre les briques ainsi que la communication et valorisation des résultats du
    projet.  •WP1: Accélération de l’exploration de concepts de matériaux combustibles
    innovants via la conception numérique  •WP2: Accélération de la fabrication de
    prototypes innovants via la fabrication additive céramique  •WP3: Accélération de la
    découverte de précurseurs d’oxydes via des solvants nanostructurés et une approche
    millifluidique •WP4: Accélération de la validation de proposition de concepts
    innovants via la caractérisation accélérée de leur propriétés thermiques et
    mécaniques sur petits échantillons  •WP5: Accélération de l’évaluation des
    propriétés des combustibles innovants par des méthodes d’apprentissage automatique
    •WP6: Management, transversalité, dissémination, enseignement/formation
  start_date: "2025-09-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2029-08-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/fast-in-fuels/"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

