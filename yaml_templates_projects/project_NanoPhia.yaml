project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "NanoPhia"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Understanding nanoparticle formation in physical synthesis: Using AI to couple characterization, in-situ measurement and simulations"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    La structure cristallographique des nanoparticules pilote directement leur propriété
    physico-chimique et a foritiori leur potentiel applicatif. Un défi majeur pour faire
    progresser les nanotechnologies par l’usage des nanoparticules demeure donc dans
    notre capacité à contrôler leur taille, la phase cristalline, la morphologie et la
    composition chimique. Une approche empirique est actuellement privilégiée et
    consiste en une objectivation de la relation entre les paramètres de synthèse et les
    caractéristiques morphologiques et structurales. Mais l’espace des paramètres est
    parfois trop grand pour qu’une approche purement empirique suffise. Pour aller au-
    delà, il devient crucial d'obtenir une meilleure compréhension des mécanismes
    impliqués durant la synthèse de nanoparticules et en particulier durant la
    nucléation du cristal. Dans notre projet, nous concentrons nos efforts sur les
    méthodes de synthèse par voie physique. Notre consortium mobilise trois équipes de
    recherche possédant chacune une méthode de synthèse par voie physique différente:
    chemical vapor synthesis (INSP-Paris), magnetron sputtering inert-gas condensation
    (CEMES-Toulouse) et Laser ablation in liquid (ILM-Lyon). Ces méthodes ont pour point
    commun le passage par une phase plasma au sein de laquelle les collisions entre les
    espèces chimiques permettent la nucléation des nanoparticules dans des conditions
    hautement hors équilibre. En travaillant sur un même matériau, l’étude permettra
    donc un benchmark des conditions de synthèse. En pratique, nous avons choisi de
    travailler sur des oxydes de complexité graduelle ie. ZnO, CuxOy et enfin ZnxCuyOz.
    Ces matériaux présentent des intérêts d’un point de vue application en catalyse et
    en biomédicale mais aussi une riche complexité structurale (polymorphisme avec une
    dépendance possible envers la taille) . Au-delà du regroupement inédit de ces trois
    méthodes de synthèse, notre projet vise à développer une expérience de spectroscopie
    mobile capable d’être déployée sur les différentes expériences de synthèse. En
    particulier, il s’agira de mesurer l’évolution temporelle des propriétés
    thermodynamiques du plasma aux temps courts en fonction des conditions
    expérimentales. La comparaison des méthodes permettra un mapping des
    caractéristiques thermodynamiques incluant une composante temporelle. Fort de ces
    résultats, nous construirons un modèle basé sur l’IA permettant d’établir une boucle
    de rétroaction entre les paramètres expérimentaux imposés en synthèse et les
    propriétés thermodynamiques. Dans la troisième partie de notre projet, nous
    utiliserons la dynamique moléculaire assistée par champs de force machine-learning
    afin d’obtenir un jumeau numérique des expériences de synthèse calqué sur les
    propriétés thermodynamiques mesurées.
  start_date: "2026-03-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-02-28"   # REQUIRED  YYYY-MM-DD
