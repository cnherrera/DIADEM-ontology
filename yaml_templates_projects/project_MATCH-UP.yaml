project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "MATCH-UP"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "MATerials disCovery for next generation pHotovoltaics via highthroUghPut synthesis, characterization and ai-based analysis"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Dans le contexte de transition énergétique, de transformation digitale, de crise
    climatique, et de souveraineté énergétique, la mise au point accélérée de matériaux
    et dispositifs pour le photovoltaïque qui sont à la fois fiables, sobres, non
    toxiques et performants est un élément clé. Ceci passe par une collaboration accrue
    entre les différentes expertises des laboratoires et les lignes pilotes R&D
    industrielles (alimentant les gigafactories françaises en projet), et une meilleure
    circulation des données expérimentales permise par l'automatisation et la
    robotisation des procédés, les caractérisations haut débit et les analyses par
    modélisation physique et intelligence artificielles associées. Pour répondre à cette
    nécessité et aux objectifs de l’AAP, le présent projet rassemble un consortium aux
    compétences équilibrées sur les aspects matériaux, procédés de synthèse et dépôt de
    couches minces, analyse par caractérisation in situ et dégradation avancées, analyse
    de dispositifs PV, automatisation et analyse par modélisation physique et IA. Cette
    complémentarité est un élément clé pour ce type de projet qui à la fois nécessite
    une forte collaboration mais également permet d’accélérer les collaborations grâce à
    la nouvelle plateforme développée localement, ainsi que les données générées et
    valorisées. L'automatisation des différentes étapes allant de la synthèse à
    l'analyse haut débit des dispositifs solaires permet d'accélérer le design de
    couches minces, multicouches et cellules solaires. Ceci en permettant la découverte
    accélérée de nouveaux matériaux, la prédiction de propriétés matériaux et de figures
    de mérites de dispositifs solaires tout en réduisant drastiquement les temps
    nécessaires pour l'exploration, l'analyse et la création de savoir. Pour résoudre
    les problèmes inhérents à la recherche de nouveaux matériaux et dispositifs
    solaires, les méthodes d'intelligence artificielle associées à l'automatisation des
    analyses de dépôt, caractérisation et dégradation permet d'augmenter la
    quantité/qualité, reproductibilité des échantillons et fiabilité des données crées.
    A ce jour une infime partie des données générées dans les laboratoires est utilisée,
    partagée et suffisamment fiable pour permettre une utilisation plus globale et
    permettre d'exploiter le plein potentiel des méthodes de data science. Pour ce faire
    nous proposons de rassembler en une seule plateforme automatisée : procédé de dépôt
    de couche mince, caractérisation et analyse de dégradations haut débit et pouvant
    alimenter des instruments nationaux plus sophistiquées comme par exemple les
    synchrotrons.
  start_date: "2024-10-31"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-10-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/match-up/"   # optional
