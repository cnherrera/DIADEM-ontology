    CombinatorialSynthesis: "Synthèse combinatoire en parallèle pour générer de vastes bibliothèques de composés."
    CoordinationChemistry: "Chimie de coordination pour la conception de complexes métalliques et de réseaux matériels."
    DirectedAssembly: "Assemblage dirigé de nanostructures à l'aide de champs externes."
    ElaborationProcesses: "Procédés et techniques d'élaboration et de transformation des matériaux."
    FlowChemistry: "Chimie en flux continu pour une synthèse précise et scalable."
    HighThroughputMetallurgy: "Traitement et préparation métallurgique à haute vitesse et haut débit."
    HighThroughputSynthesis: "Synthèse à haut débit pour la génération rapide de bibliothèques de matériaux."
    LaserProcessing: "Traitement et modification de matériaux assistés par laser."
    LightInducedProcesses: "Procédés et réactions chimiques ou structurelles induits par interaction avec la lumière."
    LiquidPhaseSynthesis: "Synthèse en phase liquide pour l'obtention de particules et de matériaux structurés."
    MOCVD: "Dépôt chimique en phase vapeur organométallique."
    MagnetFabrication: "Lignes de traitement pour la fabrication d'aimants permanents massifs."
    MaterialsShaping: "Mise en forme et structuration physique des matériaux en 3D."
    MaterialsSynthesis: "Méthodologies de synthèse pour la création de nouveaux solides et composés."
    Microfluidics: "Plateformes microfluidiques pour la manipulation et la synthèse à micro-échelle."
    MolecularBeamEpitaxie: "Épitaxie par jets moléculaires pour le dépôt monocristallin ultra-pur."
    MolecularBeamEpitaxy: "Épitaxie par jets moléculaires pour la croissance contrôlée de couches atomiques."
    MolecularChemistry: "Chimie moléculaire axée sur la conception et la réaction de molécules discrètes."
    Nanoparticles: "Synthèse et manipulation de particules à l'échelle nanométrique."
    OrganometallicChemistry: "Chimie organométallique pour la préparation de composés métal-carbone."
    PVDCoating: "Dépôt physique en phase vapeur pour couches minces fonctionnelles."
    Photopolymerization: "Photopolymérisation induite par la lumière pour le durcissement de résines."
    ROMP: "Polymérisation par métathèse par ouverture de cycle."
    SeedMediatedGrowth: "Croissance de cristaux dirigée par des germes précurseurs."
    SmartGrowth: "Croissance intelligente de cristaux pour l'optimisation des domaines."
    SoftChemistry: "Chimie douce à basse température pour les solides inorganiques."
    ThermalSpray: "Projection thermique pour revêtements protecteurs contre l'usure ou la corrosion."
    ThinFilmDeposition: "Dépôt de couches et de films minces sur divers substrats."

