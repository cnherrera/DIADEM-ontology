1_DIGITAL_METHODS_AI_AND_DATA:
  description: "Outils numériques, infrastructure de données, flux de travail et intelligence artificielle appliqués à la science des matériaux."
  concepts:
    AIApproaches: "Méthodes et approches d'intelligence artificielle orientées vers la conception, l'analyse et l'optimisation des matériaux."
    AIAssistedCharacterization: "Caractérisation et analyse des matériaux accélérées et automatisées grâce à des algorithmes d'IA."
    AIBasedModelling: "Modélisation prédictive et conception d'alliages et de matériaux guidées par l'IA."
    AiiDAPluginDevelopment: "Développement d'extensions et de plugins personnalisés pour la plateforme d'automatisation AiiDA."
    AiidaWorkflows: "Flux de travail scientifiques automatisés et reproductibles gérés avec AiiDA."
    Algorithms: "Algorithmes computationnels pour le traitement des données, l'optimisation et la simulation."
    AutomatedExploration: "Exploration automatisée des espaces de paramètres et de la synthèse des matériaux."
    BayesianOptimization: "Optimisation probabiliste efficace pour la recherche de paramètres avec peu d'essais."
    BigDataAnalysis: "Traitement et extraction de connaissances à partir de grands volumes de données scientifiques."
    CNN: "Réseaux de neurones convolutifs appliqués à la reconnaissance de motifs et d'images microstructurales."
    Containerization: "Conteneurisation et isolation de logiciels scientifiques via des conteneurs pour garantir la reproductibilité."
    DataEngineering: "Ingénierie des pipelines de données pour la préparation et la transformation des données scientifiques."
    DataReduction: "Techniques de réduction et de compression de données pour simplifier les grands ensembles de données."
    DataStorage: "Solutions de stockage et de gestion sécurisée des données expérimentales et simulées."
    DatabaseInfrastructure: "Systèmes et infrastructures pour le stockage ordonné des données de matériaux."
    DatabaseInfrastructureDesign: "Conception architecturale de bases de données évolutives pour les données de recherche."
    DatabaseMining: "Exploration de données (data mining) pour découvrir des motifs implicites dans les bases de données de matériaux."
    DeepLearning: "Modèles d'apprentissage profond pour la cartographie de relations complexes en science des matériaux."
    Descriptors: "Représentations numériques ou structurelles de matériaux utilisées dans les modèles d'apprentissage automatique."
    DigitalTwin: "Jumeaux numériques interactifs de matériaux ou de procédés pour le suivi et la prédiction."
    ExperimentalAndSimulatedData: "Intégration et couplage d'ensembles de données expérimentales et de données de simulation."
    FAIRDataHandling: "Gestion des données de recherche selon les principes FAIR (Facile à trouver, Accessible, Interopérable et Réutilisable)."
    FastDataCollection: "Acquisition rapide de données et analyse en ligne pendant les expériences."
    GraphNeuralNetworks: "Réseaux de neurones sur graphes pour représenter les réseaux moléculaires et les structures cristallines."
    GuixPackaging: "Gestion de paquets et d'environnements informatiques reproductibles à l'aide de GNU Guix."
    HighPerformanceComputing: "Calcul haute performance (HPC) et supercalcul pour la simulation et l'analyse intensive."
    LargeScaleWorkflows: "Orchestration de flux de travail computationnels à grande échelle et à haute performance."
    MLIP: "Potentiels interatomiques basés sur l'apprentissage automatique pour des simulations atomiques précises."
    MLPValidation: "Méthodes de validation pour évaluer la précision et la stabilité des potentiels ML."
    MLWorkflowDesign: "Conception de flux de travail pour des projets d'apprentissage automatique de bout en bout."
    MachineLearning: "Techniques d'apprentissage automatique pour la modélisation des propriétés et la découverte de matériaux."
    MetadataStandardization: "Standardisation des schémas de métadonnées pour améliorer l'interopérabilité des données."
    MultiObjectiveOptimization: "Optimisation mathématique simultanée de multiples objectifs ou propriétés contradictoires."
    NeuralNetworkPotentials: "Potentiels interatomiques construits par des réseaux de neurones artificiels."
    NeuralNetworks: "Réseaux de neurones pour des tâches de régression, de classification et de génération de matériaux."
    QualityDiversity: "Algorithmes d'optimisation visant à trouver des ensembles de solutions à la fois de haute qualité et diversifiées."
    Regression: "Techniques de régression statistique et d'apprentissage automatique pour prédire des propriétés continues."
    ReinforcementLearning: "Apprentissage par renforcement pour la prise de décision autonome dans la conception expérimentale."
    RobotProgrammingAndControl: "Programmation et contrôle de robots autonomes pour l'automatisation de laboratoire."
    ScientificCodes: "Développement et optimisation de codes de calcul scientifique."
    SelfDrivingLab: "Laboratoires autonomes combinant robotique et IA pour l'expérimentation en boucle fermée."
    SmartControl: "Systèmes de contrôle intelligent pour le réglage dynamique des procédés expérimentaux."
    StructureDatabase: "Bases de données spécialisées dans les structures cristallines et moléculaires."
    SupervisedMachineLearning: "Modèles d'apprentissage automatique supervisé entraînés avec des données d'entrée/sortie étiquetées."
    SymbolicAI: "Intelligence artificielle symbolique basée sur des règles et une logique explicable."
    UnsupervisedMachineLearning: "Apprentissage non supervisé pour regrouper et découvrir des motifs sans étiquettes préalables."
    WebDevelopment: "Développement d'applications web pour l'accès et l'interaction avec les données scientifiques."
    WorkflowDesign: "Conception conceptuelle et structuration de flux de travail expérimentaux ou computationnels."
    WorkflowOrchestration: "Automatisation et orchestration de l'exécution de flux de travail complexes."

