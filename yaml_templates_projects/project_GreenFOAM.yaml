project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "GreenFOAM"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Accelerated discovery and optimization of high-performance green foams with controlled hierarchical architecture by light-driven processes"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Chaque année, plus de 600000 tonnes de mousses sont produites pour la literie, les
    meubles, les sièges, les articles de sport et de nombreux autres objets de notre
    quotidien. Initialement adoptées dans l’industrie du transport pour l’allègement des
    structures afin de minimiser la consommation d’énergie, les mousses polymères
    occupent aujourd’hui une place prépondérante dans l’emballage, l’électronique,
    l’ameublement ou les matériaux de construction, grâce à leur légèreté
    exceptionnelle, leur capacité à absorber les chocs ainsi que leur faible
    conductivité thermique et électrique. Au regard du potentiel industriel et
    économique de ce secteur, ainsi que des enjeux environnementaux, la conception de
    mousses polymères plus performantes et dégradables, ainsi que le développement de
    nouveaux modes de fabrication de ces mousses plus efficients et vertueux
    représentent des enjeux industriels et environnementaux considérables. Cependant,
    les mousses sont des matériaux à l’architecture complexe. Elles sont structurées
    selon des agencements tridimensionnels plus ou moins complexes, périodiques, mais le
    plus souvent aléatoires. Le champ de conception de ces matériaux englobe un nombre
    considérable de combinaisons qui rend difficile d’appréhender la recherche d’une
    conception optimale, que ce soit via des mesures expérimentales ou des simulations
    numériques. En particulier, la structure complexe et parfois stochastique des
    mousses rend difficile le développement de modèles constitutifs pour ces matériaux
    architecturés. Dans le cadre du projet GreenFoam, l’objectif est de mettre en place
    une démarche scientifique couplant expérimentation rationnalisée et à haut débit,
    simulation numérique et intelligence artificielle pour accélérer la découverte de
    mousses à haute performance plus éco-responsables. Notre stratégie repose sur 4
    piliers que sont i) la synthèse de nouveaux pré-polymères sans isocyanate,
    dégradables et photosensibles, ii) la fabrication d’architecture 3D macroscopique
    par des procédés photo-induits, iii) la caractérisation des phénomènes de moussage
    et des propriétés mécaniques sous environnement contrôlé, et iv) le recours à
    l’intelligence artificielle pour déterminer les architectures hiérarchiques
    optimales en fonction des propriétés ciblées.
