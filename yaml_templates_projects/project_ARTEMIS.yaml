# ─────────────────────────────────────────────────────────────────────────────
#  DIADEM Project Description File  
#  One file per project (targeted or AAP).
#  Fill every field marked REQUIRED. Optional fields can be left blank or omitted.
#  Dates must follow ISO 8601: YYYY-MM-DD
#  Lists use the YAML dash-item syntax.
# ─────────────────────────────────────────────────────────────────────────────

project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ARTEMIS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "AcceleRaTed discovery and dEvelopment of smart Materials and structures with 4D prInting technologieS"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Introduite en 2013 par le Massachusetts Institute of Technology et l'Université du
    Colorado (USA), l'impression 4D combine la fabrication additive et les matériaux
    actifs pour construire des objets physiques capables de changer de forme et/ou de
    propriétés en réponse à un stimulus énergétique. En ajoutant le paramètre temps dans
    l'espace 3D, les relations entre les besoins des applications et les moyens
    technologiques pour les satisfaire deviennent plus compliquées, voire complexes.
    Dans ce projet, le consortium national abordera différents axes de recherche,
    comprenant le numérique (base de connaissances et apprentissage automatique lié aux
    matériaux et aux structures), les matériaux et les procédés, des actions
    prospectives (en reliant par exemple l'impression 4D et le biomimétisme comme fil
    conducteur et/ou sur l’intelligence des matériaux). La satisfaction des besoins
    exprimés dans ce "saut technologique" devrait [enfin] être à même de faire passer le
    domaine de l'impression 4D d'un rôle académique à des applications industrielles.
  start_date: "2023-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-04-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/artemis/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "3D/4D Poudrinnov (Metal/Polymer Additive Manufacturing)"
    - "Combinatorial low pressure micro-Cold Spray equipment"
    - "Two-photon light polymerization"

