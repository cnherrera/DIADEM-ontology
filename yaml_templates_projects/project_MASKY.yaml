project:
  type: "AAP2024"          # REQUIRED - "Targeted" or "AAP"
  acronym: "MASKY"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Advanced MAterials for SKYrmion based Spintronics"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Les composants spintroniques, dont le fonctionnement est basé sur l'utilisation de
    skyrmions (textures magnétiques chirales de nature particulaire), présentent des
    caractéristiques prometteuses pour les technologies de logique et de mémoire
    magnétique au-delà du CMOS avec des caractéristiques qui permettraient une
    électronique plus frugale et plus agile. L'un des défis réside dans l'identification
    de multicouches ultraminces présentant les propriétés magnétiques permettant de
    créer et de stabiliser des skyrmions aux propriétés spécifiques et optimales en
    termes de taille, de stabilité et réponse fréquentielle pour les applications
    visées. Dans le projet MASKY, nous avons l'intention d'utiliser une approche basée
    sur l'intelligence artificielle prédictive et l'exploration de données pour
    considérablement accélérer la découverte des meilleurs candidats composés de
    matériaux hybrides multicouches. Le besoin élevé en données de l'IA sera satisfait à
    la fois par i) la fabrication d'échantillons à gradient multidirectionnel (par
    exemple, épaisseur et composition variant dans trois directions du plan) et par ii)
    leur caractérisation à haut débit. Enfin, le prototypage de composants permettra de
    vérifier la capacité prédictive de l'IA tout en établissant une boucle de
    rétroaction pour l'IA. Nous nous concentrerons en particulier sur les propriétés
    magnétostrictives des empilements déposés sur des substrats piézoélectriques, afin
    de trouver des skyrmions très sensibles aux ondes acoustiques de surface. Les
    recherches dans ce domaine à l'interface entre la skyrmionique et la straintronique,
    domaine très récents de la spintronique, bénéficieront ainsi des avancées permises
    par l'IA. À travers le projet MASKY, nous allons démontrer la nature transformatrice
    de l'approche proposée, qui est actuellement largement sous-utilisée dans le domaine
    de la spintronique. Outre la découverte accélérée de matériaux hybrides utiles dans
    le cadre des composants à base de skyrmions, la méthode utilisée dans MASKY pourrait
    être transposée à d'autres domaines de la spintronique et même plus largement à
    d'autres technologies émergentes.
  start_date: "2026-02-02"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-02-01"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/masky/"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

