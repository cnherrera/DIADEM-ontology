  title: "data-auGmented mAterial engineeRing for advaNced surfacE functTionalization"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    La projection thermique est une famille de procédés de revêtements obtenus à partir
    d’une source d’enthalpie et de quantité de mouvement qui permet de projeter des
    matériaux pour former un revêtement. Ce dernier est constitué d’un empilement de
    lamelles dont l’état thermocinétique des matériaux à l’impact sur le substrat
    conditionne les propriétés du revêtement. La projection couvre un large spectre de
    procédés (projection gaz froid, combustion, plasma) et peut ainsi être appliquée à
    toutes les grandes catégories de matériaux (polymères, métaux, céramiques, cermets,
    …). Les paramètres opératoires, comme les caractéristiques des matériaux initiaux et
    les paramètres du procédé, permettent d’ajuster les propriétés des revêtements
    déposables sur des géométries complexes. La projection thermique est une technologie
    mature qui adresse de nombreux secteurs industriels tels que l'automobile,
    l'aérospatiale, la médecine, les turbines à gaz industrielles, l'imprimerie. Les
    revêtements sont exploités pour leur résistance aux températures élevées et à la
    corrosion (e.g. barrières thermiques, TBC), leur résistance à l’usure, chimique,
    isolation électrique, etc…Cependant, le nombre relativement important de paramètres
    de procédés, leurs effets couplés et non-linéaires sur le traitement thermocinétique
    des particules, les échelles de temps et d’espace décrivant les mécanismes s’étalant
    sur plusieurs ordres de grandeur rendent complexes l’optimisation expérimentale du
    procédé et la mise en oeuvre des modélisations et simulations numériques.
    L’Intelligence Artificielle (IA) est une alternative d’optimisation de procédés
    complexes grâce à l’utilisation des données produites par des capteurs et des
    systèmes de diagnostics avancés. L’IA permet de développer des processus industriels
    durables et économes en ressources, réduisant les besoins énergétiques et les
    déchets sans sacrifier la qualité des systèmes. Le projet GRENAT a pour objectif de
    répondre au second axe thématique de DIADEM sur l’accélération de la maîtrise des
    procédés en s’appuyant sur la plateforme technologique de fonctionnalisation de
    surface avancée SAFIR issue du laboratoire commun Prothéis entre l’IRCER, SAFRAN et
    OERLIKON. Le consortium sera également composé du partenaire CEA-LIST spécialisé
    dans l’IA, la science des données et les capteurs innovants. Le projet GRENAT
    constituera la première brique d’IA, comme preuve de concept, pour prédire les
    propriétés des revêtements sur deux systèmes complémentaires modèles de couples
    procédés/matériaux (projection plasma de poudres/abradables et projection plasma de
    suspensions/TBC) dans l’environnement de SAFIR et qui interagira avec les projets
    ciblés RUBIS sur les procédés céramiques et DIAMOND sur les bases de données et
    outils IA de DIADEM.
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
