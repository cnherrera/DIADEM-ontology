project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "AMETHYST"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "AI AND HIGH THROUGHPUT METHODS GUIDING THE DESIGN OF POLYMERIC MATERIALS"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Avec une production mondiale de près de 380 millions de tonnes par an, les matériaux
    polymères jouent un rôle central dans la société moderne. En fait, ils sont utilisés
    dans la fabrication d'innombrables produits de la vie quotidienne ou comme composés
    plus sophistiqués en médecine, en diagnostic et en chimie fine. Cependant, les
    contraintes économiques et les nouvelles contraintes sociétales imposent une
    conception plus rationnelle et des modes alternatifs de synthèse et de formulation
    des polymères pour répondre aux besoins de plus grande durabilité, de gestion plus
    vertueuse de la fin de vie et d'amélioration des performances. Les matériaux à base
    de polymères du futur seront l'un des piliers de l'économie circulaire. Ainsi, la
    découverte de nouveaux polymères entraînera un changement de paradigme et de
    nouvelles techniques pour la conception, le traitement et l'analyse des matériaux à
    base de polymères. Le développement récent des méthodes à haut débit (HTP) et
    d'intelligence artificielle (IA) a ouvert d'énormes opportunités pour relever ces
    défis. Si de telles méthodes émergent en chimie, elles ne sont pas encore mises en
    œuvre en France en Science des Polymères. Ainsi, le projet de démonstrateur AMETHIST
    propose, comme preuve de concept, de fusionner ces domaines par l'utilisation
    combinée des méthodes HTP et IA pour aborder quatre études de cas différentes dans
    le domaine des polymères. Les problématiques abordées ont été choisies pour leur
    pertinence face à des enjeux scientifiques et sociétaux pressants : - Etude de cas 1
    – Conception de matériaux polymères à dégradabilité programmable - Etude de cas 2 –
    Nanocomposites et composites à base de polymères - Etude de cas 3 – Matériaux
    organiques-inorganiques à base de polymères - Etude de cas 4 – Matériaux biosourcés
    Dans chaque étude de cas, chaque type de matériau, méthode de synthèse et de
    caractérisation des HTP sera mis en œuvre aux échelles moléculaire, macromoléculaire
    et des matériaux (voir schéma récapitulatif). Les données de l'analyse HTP seront
    utilisées pour alimenter les approches d'apprentissage automatique afin de
    déterminer la meilleure combinaison avec plusieurs propriétés ciblées. Des matériaux
    optimisés conçus par l'IA seront fabriqués et évalués.
  start_date: "2022-10-15"   # REQUIRED  YYYY-MM-DD
  end_date:   "2026-10-14"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/amethyst/"   # optional
