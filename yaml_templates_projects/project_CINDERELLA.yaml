project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "CINDERELLA"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "3D metal printing control using innovative laser sources, digital augmented models and artificial intelligence"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le procédé de Fusion Laser sur Lit de Poudre (ou Laser Powder Bed Fusion, LPBF) est
    aujourd’hui en pleine phase de développement industriel en raison de sa capacité à
    élaborer des géométries complexes. Pourtant, plusieurs verrous limitent ses
    capacités et entravent sa plus large dissémination industrielle : recherche
    paramétrique longue et itérative, difficulté d’adaptation de microstructures,
    instabilités du procédé, manque d’outils numériques fiables et performants
    permettant d’optimiser en amont le processus de fabrication, ou encore l’absence de
    contrôle en ligne du procédé. Le projet CINDERELLA ambitionne de contribuer à
    l’accélération de la maitrise du procédé LPBF en adoptant une approche à la fois
    expérimentale et numérique assistée par Intelligence Artificielle (IA), de maitrise
    de l’interaction laser-matière au niveau du bain liquide métallique et de la
    génération de la microstructure. Les résultats du projet contribueront : (1) à
    l’accélération de l’optimisation paramétrique pour de nouveaux matériaux et pour des
    matériaux réputés difficiles, (2) à l’obtention des microstructures désirées en
    sortie du procédé, couplée à la minimisation des contraintes/déformations thermiques
    des composants permettant de réduire le supportage des pièces, et, potentiellement,
    à un contrôle du procédé, (3) au développement de modèles numériques plus
    performants, intégrant la variété des différentes échelles d’études. Pour cela, le
    projet propose une approche selon deux axes. Le premier est l’expérimentation
    avancée du procédé : Des études précédentes ont montré l’intérêt de la mise en forme
    spatiale et temporelle de faisceaux laser pour permettre l’élaboration de matériaux
    difficiles, l’adaptation des microstructures locales à la demande, ou encore la
    réduction des porosités. Des expérimentations instrumentées exploreront les effets
    des variations de configurations de ce type de source laser. Les outils d’IA seront
    utilisés pour l’optimisation de la recherche paramétrique (plans d’expérimentations
    assistés) et l’établissement de modèles phénoménologiques qui pourront être utilisés
    pour un couplage avec des modèles numériques Eléments Finis (FE), et pour affiner le
    contrôle en ligne des procédés. Une instrumentation et des traitements de données
    avancés permettront d’accélérer l’identification de ces modèles: caméras rapides
    pour l’étude du bain de fusion/solidification, détermination rapide d’informations
    microstructurales par capteurs ultra-sons. Le deuxième axe concerne la
    modélisation/simulation multiphysique du procédé LPBF assisté par IA. Le projet vise
    à développer, à terme, un jumeau numérique du procédé.
  start_date: "2026-03-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-02-28"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/cinderella/"   # optional
