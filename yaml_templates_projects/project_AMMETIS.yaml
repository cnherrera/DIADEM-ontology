project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "AMMETIS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "AI-assisted Simulations of Microstructure driven Mechanical properties from high Throughput and multiscale analysIS"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet AMMETIS (AI-assisted Simulations of Microstructure driven MEchanical
    properties from high Throughput and multiscale analysIS) a pour objectif d’accélérer
    notre capacité à prédire de façon fiable le comportement en service des nouvelles
    innovations matériaux proposées pour répondre aux enjeux de la transition
    énergétique. Cet objectif implique : (1) Le développement d’une plateforme
    expérimentale de caractérisation haut débit à l’échelle mésoscopique (cartographies
    mécaniques par nanoindentation et corrélation d’images/EBSD haute résolution in-situ
    MEB) pour une meilleure compréhension des relations microstructures/mécanismes de
    déformation/comportements macroscopiques en service, (2) Le développement de modèles
    de plasticité cristalline innovants (intégrant la Mécanique de Champ de Dislocations
    et la Plasticité à Gradient de Déformations). Ces modèles seront enrichis par
    l'expérience pour améliorer leurs capacités prédictives et appliqués au polycristal
    via des calculs résolus par FFT massivement parallélisés, (3) Le développement de
    modèles réduits basés sur l’IA, capables de prédire en temps réel les propriétés
    mécaniques en connaissant la microstructure, adaptés à une intégration dans un
    calcul de structure. Ce projet ambitieux regroupe 4 partenaires nationaux et est
    soutenu financièrement par deux partenaires industriels (ArcelorMittal et
    SafranTech). De plus, il sera enrichi par des collaborations avec deux laboratoires
    étrangers engagés dans des défis semblables. Les méthodologies seront optimisées et
    validées sur l’INCONEL718 en tant que matériau modèle, puis mises en oeuvre pour
    mieux comprendre et prédire le comportement : (1) des aciers de 3ème génération
    issus des procédés décarbonés pour approfondir l'impact des éléments résiduels sur
    le comportement mécanique en lien avec la microstructure (ARCELORMITTAL Maizières
    Research), (2) des matériaux à gradient de composition chimique et/ou de
    microstructure en superalliage base nickel avec des applications à la réparation des
    pièces de structure, en particulier (SafranTech).
  start_date: "2026-02-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-01-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/ammetis/"   # optional
