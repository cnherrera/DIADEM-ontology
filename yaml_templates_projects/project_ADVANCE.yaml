project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ADVANCE"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "AI-Driven Valuation and Novel Creation of Energy-efficient, Low-Dimensional, High-Entropy Alloys with Superior Catalytic Performance for Hydrogen Production"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    La demande croissante de solutions d’énergie verte souligne l’impératif de méthodes
    de production d’hydrogène efficaces. Le fractionnement de l’eau s’avère être une
    technique prometteuse dans ce contexte. Même si les métaux nobles comme le platine
    et l’iridium présentent des prouesses catalytiques louables, leur disponibilité
    limitée et leurs coûts prohibitifs les rendent moins viables pour des applications à
    grande échelle. Le présent projet ADVANCE met en lumière les alliages de basse
    dimensionnalité et à haute entropie (LD-HEA) comme alternative révolutionnaire,
    ouvrant un vaste domaine de composition pour contourner les contraintes des
    catalyseurs traditionnels. Les HEA, qui se distinguent par leur composition multi-
    éléments dans des rapports quasi équimolaires, surpassent les alliages
    conventionnels en termes de performances et de stabilité. La faible dimensionnalité
    inhérente des LD-HEA amplifie la surface, optimise le transport de charges et
    accentue les traits de confinement quantique indispensables à la catalyse. Pourtant,
    naviguer dans le vaste espace de composition des LD-HEA n’est pas sans défis,
    englobant les subtilités de la détermination des compositions optimales, la
    complexité du traitement et la compréhension naissante de leur comportement nuancé.
    Pour relever ces défis, notre recherche associe des techniques d’intelligence
    artificielle (IA) à des méthodologies expérimentales et informatiques pratiques. Les
    objectifs de la proposition sont de trois ordres:  1. Utiliser l’IA pour la
    conception et la découverte de LD-HEA, en tirant parti de l’apprentissage
    automatique (Machine Learning –ML) pour prédire les performances catalytiques et
    concevoir des algorithmes pour une identification efficace.  2. Fabriquer et
    caractériser la structure des LD-HEA recommandés par l'IA.  3. Évaluer et étudier
    les performances électrocatalytiques de ces LD-HEA.
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/advance/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
