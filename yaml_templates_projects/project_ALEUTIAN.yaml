project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ALEUTIAN"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Eutectic alloys developed by artificial intelligence and numerical computations"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet ALEUTIAN vise à développer une méthodologie pour accélérer la conception
    d’alliages métalliques liquides, comme des eutectiques. De tels alliages ont des
    applications dans de nombreux domaines comme le brasage ou la synthèse de verres
    métalliques, mais aussi comme matériaux pour l’énergie en tant que caloporteurs dans
    les réacteurs nucléaires à neutrons rapides ou que matériaux à changement de phase
    (MCPs) pour le stockage de la chaleur. Deux approches numériques complémentaires
    seront mises en oeuvre pour la conception d’alliages liquides par optimisation
    multicritère. La première repose sur le développement de modèles machine learning
    pour prédire les propriétés clés des alliages comme le point de fusion, l’intervalle
    de solidification et l’enthalpie de fusion. La seconde repose sur le criblage haut
    débit de bases de données thermodynamiques Calphad. Dans les deux cas, la recherche
    ne se limitera pas à une famille d’alliage en particulier, puisqu’une variété
    d’alliages sont susceptibles de répondre à chacune des applications des métaux
    liquides. Le projet vise principalement à développer une méthodologie applicable à
    tout type de métaux liquides, mais la découverte de nouveaux MCPs pour le stockage
    de la chaleur dans les centrales solaires à concentration est choisie comme
    application phare. Les MCPs prédits comme étant les plus prometteurs seront
    synthétisés, caractérisés, et leurs propriétés seront mesurées et comparées avec les
    prédictions. Les interactions et la réactivité des métaux liquides ainsi
    sélectionnés avec différents matériaux susceptibles de les contenir seront étudiées
    et mesurées et des solutions seront proposées. Enfin, un démonstrateur technologique
    sera réalisé afin de vérifier l’applicabilité des couples MCP/contenant sélectionnés
    pour le stockage de la chaleur dans les centrales solaires à concentration.
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/aleutian/"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

