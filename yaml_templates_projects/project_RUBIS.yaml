project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "RUBIS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Data-driven development and fabrication of ceramics and thermostructural composites: Research platform on the Factory of the Future, the Big data, the Artificial Intelligence and the associated Information Systems."   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    RUBIS se focalise sur les céramiques et les composites thermostructuraux capables de
    résister dans des environnements sévères. Le besoin de tels matériaux à haute
    température est en effet une nécessité urgente dans plusieurs domaines : énergie,
    transport, défense... Leur ténacité/caractère réfractaire leur permet d'être
    utilisés dans des applications aéronautiques, spatiales ou nucléaires par exemple.
    La science de ces matériaux modernes et des processus de fabrication associés oblige
    à considérer une approche multidisciplinaire incluant la chimie, la physique et
    l'ingénierie, étroitement liée à l'exploitation de la science des données via
    l'intelligence artificielle (IA) pour accélérer l'ensemble de la chaîne de valeur de
    fabrication. RUBIS couvre l’ensemble des problématiques de conception et de
    traitement des matériaux : mise en forme par fabrication additive, post-traitements
    de consolidation (par exemple séchage, déliantage/pyrolyse, frittage). Le projet
    RUBIS vise à transformer un ensemble d'outils de conception et de fabrication en une
    « usine intelligente intégrée » pour améliorer la productivité et le contrôle
    qualité offrant une traçabilité des pièces fabriquées. Avec la numérisation complète
    de toutes les étapes, RUBIS entend également optimiser les performances des pièces
    fabriquées, réduire leurs coûts ainsi que la consommation d'énergie et l'impact
    environnemental, et augmenter le degré de flexibilité de la production permettant la
    livraison de produits entièrement personnalisables et de haute qualité. Les deux
    livrables de RUBIS prévus à l'année 5 seront 2 plateformes : une plateforme d'outils
    de CAO pour la conception de structures céramiques et composites optimisées et une
    plateforme de fabrication entièrement numérisée intégrant les étapes de mise en
    forme par fabrication additive et de post-consolidation thermique avec des capacités
    de Machine Learning (ML) pour chacune desdites étapes de fabrication. Les 2 jalons
    associés sont prévus à l'année 3 et correspondent au cahier des charges des
    plateformes. Les matériaux à l'étude seront à la fois des matériaux oxydes et non
    oxydes adaptés aux environnements sévères envisagés. Dans le cas particulier du
    procédé de fabrication, des oxydes tels que l'alumine avec des lois de comportement
    bien documentées dans la littérature seront utilisés pour initier les
    développements.
  start_date: "2023-01-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-12-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/rubis/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "1600°C so-called pixelated sintering oven"
    - "5-axis additive and subtractive manufacturing frame..."
    - "Instrumented nanoindenter"

