project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "NACRE"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "bimetallic NAnoparticles, Chemical ordeR and machinE learning"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Les nanoparticules bimétalliques (BNPs), utilisées dans des domaines variés comme la
    catalyse, le stockage d’hydrogène, la technologie d’information, la plasmonique et
    autres, jouent un rôle clé dans la transition écologique de notre société. Leurs
    propriétés peuvent être contrôlées finement en combinant deux métaux, de plus, des
    métaux chers et polluants peuvent être remplacés par d’autres, plus abondants et
    respectueux de l’environnement sans perdre la spécificité recherchée. L’utilisation
    de catalyseurs bimétalliques permet, par exemple, une amélioration considérable de
    l’activité, la sélectivité et de la stabilité par rapport aux nanoparticules
    monométalliques. Prédire les propriétés physico-chimiques des telles BNPs reste
    pourtant extrêmement difficile car elles dépen-dent de nombreux paramètres comme la
    composition chimique, la taille, l’environnement, l’ordre chimique etc. De part de
    leur complexité, leur caractérisation peut être largement améliorée par des
    approches basées sur l’IA. Grâce à nos travaux récents sur la quantification
    chimique résolue spatialement de BNPs d’AgAu individuelles et à l’utilisation de
    différentes approches d’apprentissage automatique, nous pouvons aujourd’hui procéder
    à une caractérisation complète de telles BNPs. Elle concerne non seulement la
    taille, la forme et l’environnement, mais également l’ordre chimique, c’est-à-dire
    la distribution élémentaire à l’intérieur de BNPs de taille inférieure à 10 nm.
    Cette dernière propriété était jusqu’à présent extrêmement difficile à quantifier
    malgré son importance, notamment en catalyse où les BNPs changent souvent d’ordre
    chimique pendant un cycle catalytique. Nous proposons de développer des procédures
    standardisées pour la caractérisation de BNPs en relation avec la catalyse
    hétérogène et d’autres applications comme le stockage d’hydrogène. Nous travaillons
    avec des BNPs non-oxydées et sans surfactants, fabriquées en phase gazeuse dans une
    source d’agrégats qui permet le contrôle indépendant des paramètres les plus
    importants : composition chimique, taille et environnement. Différentes techniques
    de microscopie électronique à transmission (imagerie, spectroscopie avec sélectivité
    chimique EDX et EELS, in situ ou sous atmosphère et température contrôlées, en deux
    et trois dimensions) sont ensuite utilisées pour déterminer l’état fondamental des
    BNPs et leurs transformations chimiques durant des cycles re-dox. Des méthodes
    complémentaires d’apprentissage automatique sont utilisées pour (1) le traite-ment
    avancé des données, notamment concernant des corrélations spectrales et spatiales et
    pour (2) l’optimisation des potentiels interatomiques dans des simulations
    atomistiques. (3) Les données de référence ainsi obtenues alimenteront des bases de
    données combinant résultats expérimen-taux et théoriques pour le développement
    accéléré de nouveau matériaux par intelligence artificielle au sein du réseau
    DIADEM. Des systèmes de référence bien établis comme le
