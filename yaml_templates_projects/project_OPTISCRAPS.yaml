project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "OPTISCRAPS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Lifting the locks of the green steel industry through the optimized use of scraps and their residuals and the dynamic design of alloys"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Le projet OPTISCRAPS s’inscrit dans le contexte de la décarbonation de l’industrie
    sidérurgique et de l’arrêt à venir des hauts fourneaux. Ces changements vont
    impliquer un essor massif des filières électriques et une augmentation de la
    consommation en ferrailles issues du recyclage. Ces ferrailles constituent un apport
    d’éléments résiduels qui ne peuvent pas être éliminés de l’acier liquide avec les
    technologies actuelles d’élaboration. Ces derniers impactent la formation des
    microstructures ainsi que les propriétés finales de l’acier produit (ténacité,
    ductilité, soudabilité…). La faible disponibilité des ferrailles de bonne qualité,
    i.e. à faible niveau d’éléments résiduels, va inévitablement entrainer des tensions
    spéculatives sur les marchés et des compétitions d’usage. Afin de permettre à la
    sidérurgie nationale et européenne de conserver un avantage concurrentiel, le projet
    OPTISCRAPS vise à accélérer le développement et le déploiement de modèles
    métallurgiques permettant un pilotage dynamique des procédés de fabrication aval
    (recuit continu des produits plats), pour tenir compte de la variabilité de ces
    nouveaux éléments résiduels (Mo, Sn, Sb, As, …). Toutefois, les connaissances
    manquent sur les possibles effets de ces éléments (thermodynamique, ségrégations,
    transformations de phases, propriétés mécaniques). Cette « Science of Dirty Alloys»
    est un des défis bien identifiés pour permettre l’avènement d’une métallurgie
    durable et circulaire. Compte tenu du nombre de combinaisons possibles entre ces
    éléments, souhaitées ou subies, seule la mise en oeuvre des méthodes à haut débit,
    appuyées par des modèles d’apprentissage automatisé permettra d’étudier, dans les
    délais attendus par l’industrie, leurs effets respectifs et leurs interactions. Pour
    atteindre ces objectifs, la stratégie scientifique se décline en 3 volets fortement
    interconnectés et interdisciplinaires :  • Conception et caractérisation in situ de
    microstructures par des approches à haut débit  • Caractérisation multiéchelle
    avancée des microstructures post mortem  • Modélisation multiéchelle hybrides
    assistée par des méthodes d’apprentissage automatisé  Les principales innovations
    attendues du projet concerneront :  • Le déploiement des outils de la métallurgie
    combinatoire sur des systèmes multi constitués, avec de très nombreux éléments
    chimiques ; mais très dilués de façon complémentaire aux approches déjà déployées
    pour les éléments majoritaires dans DIADEM  • Le développement d’une méthodologie et
    des compétences pour quantifier ces éléments résiduels et leurs ségrégations dans la
    microstructure d’un acier tout au long du process (benchmark de différentes
    techniques avancées
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/optiscraps/"   # optional
