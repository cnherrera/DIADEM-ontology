project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ExplorMat"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Accelerated Exploration of a Chemical System for the Discovery of New Materials for Photovoltaics and Solid-state Lighting"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Les méthodes traditionnelles de découverte de nouveaux matériaux sont souvent
    longues et répétitives. Les récents progrès dans l'application d'algorithmes
    d'optimisation prêts à l'emploi au sein de cycles fermés synthèse-caractérisation-
    prédiction ont accéléré le processus de découverte. Cependant, les systèmes
    chimiques étudiés sont prédéfinis par les scientifiques et doivent se limiter à une
    faible dimension. Ainsi, les méthodes de type machine learning, couramment utilisées
    aujourd'hui dans les boucles fermées, conviennent à l'optimisation mais pas à la
    découverte de nouveaux matériaux exceptionnels, car ces algorithmes d'optimisation
    ne « pensent pas en dehors du cadre » créé par les scientifiques et, pour cette
    raison, ne peuvent pas faire de découvertes révolutionnaires. Dans le cadre du
    projet ExplorMat, une nouvelle méthodologie génératrice de nouvelles connaissances
    scientifiques sera développée pour explorer de manière exhaustive l'espace chimique
    et découvrir de nouveaux matériaux exceptionnels pour les technologies
    photovoltaïques et les LEDs. La stratégie principale consiste à concevoir un
    algorithme d'exploration qui se concentrera sur des régions inexplorées de l'espace
    chimique. Pour démontrer le potentiel de cet algorithme d'exploration, une boucle
    fermée entre (1) synthèse, (2) caractérisation et (3) prise de décision sera
    développée. Une prise de décision à haut débit intégrant ce nouvel algorithme
    d'exploration, basé sur des systèmes multi-agents et le data mining, générera de
    nouvelles hypothèses, décidera des systèmes chimiques à explorer et proposera
    efficacement un ensemble de nouvelles synthèses, qui seront exécutées en haut débit
    sur une plateforme robotique installée à l’IMN. Les résultats des nouvelles
    synthèses permettront d'améliorer les performances de l'algorithme d'exploration.
    Les itérations automatisées entre la prise de décision et l'expérimentation
    fonctionneront indépendamment de toute intervention humaine. La synergie entre la
    collecte de données expérimentales via une plateforme robotique et leur utilisation
    par une série de nouvelles techniques basées sur l'exploration de l'espace chimique
    sera initiée par une équipe interdisciplinaire de chimistes, spectroscopistes,
    spécialistes des matériaux computationnels, experts en machine learning et
    mathématiciens. Les propriétés optiques de la famille des halogénures de métaux
    hybrides seront étudiées. L'objectif sera de développer et de démontrer l'efficacité
    de cette nouvelle méthodologie en prouvant sa capacité à surpasser les les approches
    traditionnelles et celles basées sur les algorithmes d’optimisation dans la
    découverte de nouveaux matériaux photoluminescents blancs à base d’halogénures de
    métaux hybrides pour l'éclairage LED et les absorbeurs solaires pour le
    photovoltaïque
  start_date: "2026-02-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2030-01-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/explormat/"   # optional
