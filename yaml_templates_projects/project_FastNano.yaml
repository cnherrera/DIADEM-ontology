project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "FastNano"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Low-dimension Materials"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Les forces françaises en matière de matériaux de basse dimensionnalité se sont
    structurées dès 2011 autour de plusieurs Labex regroupant des centaines de
    chercheurs. Cette communauté est capable de produire une large gamme de
    nanomatériaux de haute qualité. La France est cependant encore absente de la
    synthèse assistée par Intelligence Artificielle (IA), bien que le Machine-Learning
    soit actuellement utilisé pour améliorer la caractérisation et l'analyse des
    performances, et pourrait potentiellement guider vers des paramètres de synthèse
    optimaux. Notre objectif est donc d'aller au-delà des méthodes actuelles en
    améliorant nos capacités de synthèse vers une production à haut débit couplée à une
    analyse en ligne assistée par IA, afin d'accélérer la voie vers de nouveaux
    nanomatériaux 0D, 1D et 2D. FastNano construira donc quatre réacteurs de synthèse
    génériques comprenant des outils de caractérisation dédiés en ligne qui alimenteront
    le traitement des données assisté par l'IA et les boucles de rétroaction sur les
    processus de synthèse ou d'assemblage, afin d'atteindre aussi rapidement que
    possible les propriétés les plus appropriées des matériaux à faible dimension
    ciblés, et les protocoles de dépôt optimaux pour les nouveaux matériaux à faible
    dimension. Les réacteurs cibleront des nanoparticules synthétisées à partir de
    phases liquides et gazeuses et les films nanocomposites correspondants, des films
    ultraminces déposés couche par couche par ALD rapide combinatoire et des
    hétérostructures bidimensionnelles préparées par assemblage robotisé de
    nanomatériaux 2D, dans le but de couvrir le champ le plus large possible de nouveaux
    matériaux et applications potentiels. Les réacteurs s'appuieront également sur des
    moyens de caractérisation externes (synchrotrons, TEM...) et sur la modélisation
    pour alimenter le traitement des données assisté par l'IA et améliorer les
    conditions de synthèse via des boucles de rétroaction. Le développement complet
    prendra 4 ans, avec des livrables sous forme d'outils opérationnels ouverts après 2
    ans.  Une fois validées sur des nanomatériaux connus et quelques nouveaux, ces
    réacteurs deviendront des plateformes de synthèse ouvertes disponibles pour la
    communauté par le biais d'appels ouverts au sein de DIADEME, en tant que livrables
    directs de FastNano (de T0+2 ans à T0+8 ans).
  start_date: "2022-07-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2027-06-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/fastnano/"   # optional
  associated_platforms:  # List the associated DIADEM platforms - optional
    - "AFM microscope"
    - "High-speed lab SWAXS"
    - "In-line Raman spectrometer"
    - "Nano-hybrid 1D/2D (ANAPURNA)"
    - "Nanoparticles gas route FSP"
    - "Nanoparticles liquid route"
    - "Optical multi-characterization platform for two-dimensional materials"
    - "Robotic synthesis of van der Waals heterostructures"
    - "Spatial ALD"
    - "Spray deposition and laser annealing"
    - "Synthesis of 2D materials by CVD"

