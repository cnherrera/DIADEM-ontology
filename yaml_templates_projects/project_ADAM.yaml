project:
  type: "Targeted"          # REQUIRED - "Targeted" or "AAP"
  acronym: "ADAM"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "Accelerated Design of Architectured Materials"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    Avec une demande grandissante de matériaux multifonctionnels aux propriétés
    optimisées, l’approche usuelle de design de matériaux qui optimise leur chimie et
    leur nanostructure est intéressante mais atteint ses limites. Pour les dépasser, une
    approche complémentaire s’avère pertinente et consiste à tirer parti de l’échelle
    supérieure, la mésostructure, dans laquelle l’architecture du matériau peut être
    pilotée par hybridation et/ou optimisation de la géométrie. Cette démarche nécessite
    le recours à des procédés d’élaboration et de mise en forme des matériaux innovants,
    comme l’impression 3D ou 4D. En profitant des avancées récentes sur l’intelligence
    artificielle et la fouille de données, le projet ADAM (Accelerated Design of
    Architectured Materials) se propose de découvrir de nouveaux matériaux architecturés
    (i) aux mesostructures optimisées pour des propriétés multifonctionnelles
    augmentées, (ii) qui représentent de réelles ruptures au regard des solutions
    matériaux existantes, (iii) en accélérant ce processus de design d’un facteur dix.
    La preuve de concept globale sera mise en évidence avec trois matériaux
    architecturés imprimés, en phase avec les problématiques majeures de la transition
    énergétique et du changement climatique. Ils sont d’intérêts particuliers dans le
    domaine de l’énergie, du transport de biens et de personnes ou bien encore de la
    santé. Pour les deux premiers systèmes architecturés, métalliques, nous optimiserons
    leur mise en forme, leurs mesostructures et leurs propriétés thermiques (conductives
    et radiatives) et mécaniques (élasto-plastiques) en couplant (1) imagerie 3D in
    operando en temps réel sur dispositif de fabrication additive instrumenté, (2)
    imagerie 3D in situ en temps réel au cours de la déformation des architectures
    produites, (3) modélisation numérique avancée en science des matériaux et en
    optimisation de structures, et (4) techniques issues de la fouille de données et de
    l’intelligence artificielle. Le troisième système sera un système bio-sourcé
    hydrophile élaboré par impression et optimisé pour atteindre des propriétés
    hygromorphes nouvelles.
  start_date: "2023-04-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-12-31"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/adam/"   # optional
