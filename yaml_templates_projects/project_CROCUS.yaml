project:
  type: "AAP2023"          # REQUIRED - "Targeted" or "AAP"
  acronym: "CROCUS"      # REQUIRED - short identifier, no spaces (used as RDF local name)
  title: "miCro laboRatory fOr antiCorrosion solUtion deSign"   # REQUIRED
  description: >          # REQUIRED - free text, multiline OK
    L’objectif du projet CROCUS est le développement d’un micro-laboratoire d’analyse in
    situ de la corrosion pouvant être mis en ligne avec des procédés de synthèse de
    matériaux ou revêtements anticorrosion, également haut débit, tels que ceux mis en
    oeuvre sur la plateforme de PECVD (plasma enhanced chemical vapor deposition)
    atmosphérique en cours d’investissement dans le cadre du projet A-DREAM, la
    plateforme de PVD (physical vapor deposition) combinatoire mise en oeuvre dans le
    projet ciblé HIWAY-2-MAT ou la plateforme développée à l’INSTN (institut national
    des sciences et techniques nucléaires) de Saclay, DIADEM-2D. A cette fin, une
    nouvelle plateforme de bibliothèque combinatoire de systèmes de
    conception/fabrication d’alliages couplée à une analyse électrochimique à haut débit
    à l’échelle élémentaire sera développée dans le projet CROCUS. Une nouvelle méthode,
    la spectroélectrochimie d’émission atomique (AESEC), sera utilisée pour accéder à
    l’électrochimie résolue par éléments, complémentaire aux mesures électrochimiques
    conventionnelles. Cette technique permet de tracer chaque élément d’alliage lors de
    l’activation, de la passivation et de la dégradation du matériau. L’objectif de
    CROCUS consiste en la mise en oeuvre d’une technique d’analyse électrochimique
    élémentaire couplée à d’autres techniques de mesure in situ permettant l’étude du
    comportement en corrosion de matériaux/revêtements multiéléments complexes (e.g.,
    alliages industriels, oxydes complexes). Une évaluation électrochimique accélérée à
    haut débit sera réalisée via une mesure par cellule microfluidique (SDC) en
    collaboration avec le projet 2FAST. Ce projet ouvrira ainsi une réelle opportunité
    de constituer une base de données corrosion élément par élément dans une large gamme
    de milieux agressifs, qu’ils soient naturels ou industriels, de compositions,
    concentrations, pH et températures, différents permettant alors le développement de
    nouvelles générations de matériaux ou revêtements résistants à la corrosion par
    l’utilisation d’outils de conception numérique et d’optimisation par intelligence
    artificielle (l’IA) en collaboration avec le projet DIAMOND. La base de données
    expérimentale, combinée à des outils d’AI, sera utilisée pour établir des relations
    empiriques quantitatives pour diverses formes de corrosion, telles que le PREN
    (pitting resistance equivalent number) utilisé dans l’industrie d’acier inoxydable
    pour la corrosion par piqûres. La validation des indices ainsi déterminés sera
    réalisée par des essais intégraux de corrosion sur des matériaux élaborés répondant
    aux critères définis précédemment. Dans ce projet, des alliages et systèmes oxydes
    complexes seront notamment élaborés par des procédés haut débit. Une étude
    systématique sera réalisée en tenant compte de la composition chimique,
  start_date: "2024-10-01"   # REQUIRED  YYYY-MM-DD
  end_date:   "2028-09-30"   # REQUIRED  YYYY-MM-DD
  documentation_url: "https://www.pepr-diadem.fr/projet/crocus/"   # optional
  associated_platforms: []  # List the associated DIADEM platforms - optional

